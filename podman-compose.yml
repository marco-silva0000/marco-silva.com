services:
  db:
    image: docker.io/library/postgres:16-bookworm
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=marcosilva
      - POSTGRES_USER=marcosilva
      - POSTGRES_PASSWORD=devpassword
    ports:
      - "5432:5432"

  redis:
    image: docker.io/valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    image: localhost/marco-silva.com:latest
    volumes:
      - .:/code
      - ./media:/var/www/marco-silva.com/media
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_NAME=marcosilva
      - POSTGRES_USER=marcosilva
      - POSTGRES_PASSWORD=devpassword
      - SECRET_KEY=dev-insecure-secret-key
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DEBUG=true
      - DJANGO_SETTINGS_MODULE=website.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PLANZ_PASSWORD=planz
    depends_on:
      - db
      - redis

  celery-worker:
    build: .
    image: localhost/marco-silva.com:latest
    command: ["celery", "-A", "website", "worker", "-l", "info", "--concurrency=2"]
    volumes:
      - .:/code
      - ./media:/var/www/marco-silva.com/media
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_NAME=marcosilva
      - POSTGRES_USER=marcosilva
      - POSTGRES_PASSWORD=devpassword
      - SECRET_KEY=dev-insecure-secret-key
      - DJANGO_SETTINGS_MODULE=website.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    image: localhost/marco-silva.com:latest
    command: ["celery", "-A", "website", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    volumes:
      - .:/code
      - ./media:/var/www/marco-silva.com/media
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_NAME=marcosilva
      - POSTGRES_USER=marcosilva
      - POSTGRES_PASSWORD=devpassword
      - SECRET_KEY=dev-insecure-secret-key
      - DJANGO_SETTINGS_MODULE=website.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
