name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0

  test:
    runs-on: ubuntu-24.04
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_NAME: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      SECRET_KEY: test-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DEBUG: "true"
      PLANZ_PASSWORD: planz
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev libjpeg-dev zlib1g-dev
      - run: uv sync --extra dev
      - run: uv run python scripts/generate_all_64_locales.py

      # Unit tests
      - run: USE_SQLITE=1 uv run pytest gamerooms/ lupus/ emojinary/ photos/ tools/ -v

      # Start Django for integration tests
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py seed_emojinary
      - run: |
          uv run daphne -b 0.0.0.0 -p 8000 website.asgi:application &
          echo $! > /tmp/daphne.pid
          sleep 3

      # Robot Framework tests
      - run: uv run robot --outputdir /tmp/robot-output tests/robot/planz.robot
      - run: uv run robot --outputdir /tmp/robot-emojinary tests/robot/emojinary/suites/

      # Playwright tests
      - name: Install Playwright and dependencies
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: |
          set -o pipefail
          uv run playwright install chromium --with-deps 2>&1 | tee /tmp/playwright-install.log || {
            tail -n 60 /tmp/playwright-install.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - name: Run Playwright tests
        run: |
          set -o pipefail
          uv run pytest tests/playwright/ -v --browser chromium 2>&1 | tee /tmp/playwright-test.log || {
            grep -E "FAILED|ERROR|AssertionError|^E   |^>   " /tmp/playwright-test.log | tail -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - name: Stop Daphne background server
        if: always()
        run: |
          pkill -f "daphne" 2>/dev/null || true
          for i in $(seq 1 10); do
            pgrep -f "daphne" >/dev/null || break
            sleep 0.5
          done
          pkill -9 -f "daphne" 2>/dev/null || true

  build:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
