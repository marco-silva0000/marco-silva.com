name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_NAME: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      SECRET_KEY: test-secret-key
      ALLOWED_HOSTS: localhost
      DEBUG: "true"
      PLANZ_PASSWORD: planz
      CELERY_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev libjpeg-dev zlib1g-dev
      - run: uv sync --extra dev

      # Unit tests
      - run: uv run pytest photos/tests.py --no-header -rN || test $? -eq 5

      # Start Django for integration tests
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py seed_emojinary
      - run: uv run daphne -b 0.0.0.0 -p 8000 website.asgi:application &
      - run: sleep 3

      # Robot Framework tests
      - run: uv run robot --outputdir /tmp/robot-output tests/robot/planz.robot

      # Playwright tests
      - run: uv run playwright install chromium --with-deps
      - run: uv run pytest tests/playwright/ -v --browser chromium

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
