[project]
name = "marco-silva.com"
version = "0.1.0"
description = "my website 😄"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.7",
    "django-htmx>=1.22.0",
    "django-photologue>=3.17",
    "gunicorn>=23.0.0",
    "markdown>=3.5",
    "psycopg>=3.2.5",
    "python-dotenv>=1.0.1",
    "pytz>=2025.1",
    "wagtail>=6.4",
    "wagtail-markdown>=0.12",
    "whitenoise>=6.5",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=5.0.1",
    "django-stubs>=5.1.3",
    "factory-boy>=3.3.3",
    "faker>=37.0.0",
    "pre-commit>=4.0",
    "pytest-django>=4.10.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "website.settings"
python_files = ["tests.py", "test_*.py"]
