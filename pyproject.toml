[project]
name = "marco-silva.com"
version = "0.1.0"
description = "my website 😄"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.7.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.0.10",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-htmx>=1.29.0",
    "django-photologue>=3.20",
    "gunicorn>=27.0.1",
    "icalendar>=7.3.0",
    "markdown>=3.11.3",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "pytz>=2026.6",
    "redis>=8.1.0",
    "wagtail>=8.1",
    "wagtail-markdown>=0.15.0",
    "whitenoise>=6.12.0",
    "wonderwords>=2.2.0",
    "emoji>=2.16.0",
    "ollama>=0.6.3",
    "google-genai>=3.3.0",
    "pydantic>=2.14.3",
    "qrcode[pil]>=8.2",
    "exifread>=3.5.1",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "factory-boy>=3.3.3",
    "faker>=40.54.0",
    "playwright>=1.65.1",
    "pre-commit>=4.7.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "robotframework>=7.5.1",
    "robotframework-requests>=0.9.7",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F403", "E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "website.settings"
python_files = ["tests.py", "test_*.py"]
