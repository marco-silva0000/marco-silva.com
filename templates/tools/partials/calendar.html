{% if calendar_id %}
<div style="margin-top: 0.5rem;">
  <div style="margin-bottom: 0.75rem; font-size: 0.85rem;">
    <button onclick="setView('WEEK')" style="cursor:pointer; padding: 0.2rem 0.5rem;">week</button>
    <button onclick="setView('MONTH')" style="cursor:pointer; padding: 0.2rem 0.5rem;">month</button>
    <button onclick="setView('AGENDA')" style="cursor:pointer; padding: 0.2rem 0.5rem;">agenda</button>
  </div>
  <iframe id="gcal" src="https://calendar.google.com/calendar/embed?src={{ calendar_id }}&mode=WEEK&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=1" style="border: 0; width: 100%; height: 600px;" frameborder="0" scrolling="no"></iframe>
</div>
<script>
function setView(mode) {
  const iframe = document.getElementById('gcal');
  const url = new URL(iframe.src);
  url.searchParams.set('mode', mode);
  iframe.src = url.toString();
}
</script>
{% else %}
<p style="font-size: 0.85rem; color: #888;">calendar not configured yet. set GOOGLE_CALENDAR_ID env var.</p>
{% endif %}
