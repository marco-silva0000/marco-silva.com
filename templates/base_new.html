{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Marco Silva{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; color: #222; line-height: 1.6; max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
    a { color: #222; }
    a:hover { color: #555; }
    nav { margin-bottom: 2rem; font-size: 0.9rem; }
    nav a { margin-right: 1.5rem; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #ddd; font-size: 0.8rem; color: #888; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <a href="/">home</a>
    <a href="{% url 'photologue:gallery-list' %}">photos</a>
    <a href="/blog/">blog</a>
    <a href="/cv">cv</a>
  </nav>
  {% block content %}{% endblock %}
  <footer>marco silva — {{ year }}</footer>
</body>
</html>
