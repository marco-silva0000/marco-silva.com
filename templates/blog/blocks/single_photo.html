{% if photo %}
<figure style="margin: 1.5rem 0;">
  <a href="{% url 'photos:photo-viewer' photo.slug %}">
    <img src="{% if ext and ext.web_image %}{{ ext.web_image.url }}{% else %}{{ photo.image.url }}{% endif %}" alt="{{ photo.title }}" style="max-width: 100%; height: auto;" loading="lazy">
  </a>
  {% if caption %}<figcaption style="font-size: 0.8rem; color: #888; margin-top: 0.3rem;">{{ caption }}</figcaption>{% endif %}
</figure>
{% else %}
<p style="color: #888; font-size: 0.85rem;">photo not found.</p>
{% endif %}
