{% extends 'base.html' %}
{% load i18n %}
{% block title %}{{ room.title }} — {% trans "join" %}{% endblock %}
{% block content %}
<h1 style="font-size: 1.3rem; margin-bottom: 1rem;">{{ room.title }}</h1>
<form method="post">
  {% csrf_token %}
  <input type="text" name="name" placeholder="{% trans 'your name' %}" required autofocus style="padding: 0.35rem; font-size: 0.85rem;">
  <button type="submit" style="padding: 0.35rem 0.7rem; font-size: 0.85rem; cursor: pointer;">{% trans "join" %}</button>
</form>
{% endblock %}
