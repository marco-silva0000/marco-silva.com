{% extends 'base.html' %}
{% load i18n %}
{% block title %}{{ room.title }} — {% trans "join" %}{% endblock %}
{% block content %}
<h1 style="font-size: 1.3rem; margin-bottom: 0.4rem;">{{ room.title }}</h1>
{% if language_support %}
<div style="font-size: 0.8rem; margin-bottom: 0.9rem; color: #475569;">
  <span>{{ language_support.language_display }}</span> ·
  <span style="padding: 0.1rem 0.45rem; border-radius: 999px; font-weight: 600; background: {% if language_support.content_supported %}#dcfce7; color: #166534{% else %}#fef3c7; color: #92400e{% endif %};">
    {{ language_support.badge_label }}
  </span>
</div>
{% endif %}
<form method="post">
  {% csrf_token %}
  <input type="text" name="name" placeholder="{% trans 'your name' %}" required autofocus style="padding: 0.35rem; font-size: 0.85rem;">
  <button type="submit" style="padding: 0.35rem 0.7rem; font-size: 0.85rem; cursor: pointer;">{% trans "join" %}</button>
</form>
{% endblock %}
