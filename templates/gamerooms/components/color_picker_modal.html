{% load i18n %}
<!-- Centralized Player Color Picker Modal -->
<div id="modal-player-color-picker" class="ds-modal" role="dialog" aria-modal="true" aria-labelledby="player-color-picker-title" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9999; align-items:center; justify-content:center; padding:1rem;">
  <div style="background:#ffffff; border-radius:16px; max-width:380px; width:100%; padding:1.25rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.2); animation:popIn 0.15s ease-out;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:0.75rem; margin-bottom:1rem;">
      <h3 id="player-color-picker-title" style="margin:0; font-size:1.1rem; font-weight:700; color:#0f172a; display:flex; align-items:center; gap:0.4rem;">
        <span>🎨</span> {% trans "Pick Player Color" %}
      </h3>
      <button type="button" onclick="closeColorPickerModal()" style="background:none; border:none; font-size:1.5rem; line-height:1; color:#94a3b8; cursor:pointer; padding:0 0.25rem;" aria-label="{% trans 'Close' %}">&times;</button>
    </div>
    
    <p style="margin:0 0 1rem 0; font-size:0.85rem; color:#64748b;">
      {% trans "Choose a color for your player badge and chat messages:" %}
    </p>

    <!-- Color Swatches Grid -->
    <div id="player-color-picker-grid" class="player-color-grid"></div>

    <div style="text-align:right; margin-top:1rem;">
      <button type="button" class="ds-btn" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; padding:0.4rem 1rem; border-radius:8px; font-weight:600; cursor:pointer;" onclick="closeColorPickerModal()">
        {% trans "Cancel" %}
      </button>
    </div>
  </div>
</div>
