{% extends 'base.html' %}
{% load i18n %}
{% block title %}{{ room.title }} — {% trans "room password" %}{% endblock %}
{% block content %}
<h1 style="font-size: 1.3rem; margin-bottom: 1rem;">{{ room.title }}</h1>
{% if error %}<p style="color: red; font-size: 0.85rem; margin-bottom: 0.75rem;">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <input type="password" name="password" placeholder="{% trans 'room password' %}" style="padding: 0.35rem; font-size: 0.85rem;">
  <button type="submit" style="padding: 0.35rem 0.7rem; font-size: 0.85rem; cursor: pointer;">{% trans "join" %}</button>
</form>
{% endblock %}
