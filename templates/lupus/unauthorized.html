{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto; text-align: center;">
  <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
  <h1 style="font-size: 1.3rem; font-weight: 600; margin-bottom: 0.5rem;">Access Denied</h1>
  <p style="font-size: 0.9rem; color: #666; margin-bottom: 1.5rem;">
    {{ message|default:"You need an authorized key to access this page." }}
  </p>
  {% if code %}
  <a href="{% url 'gamerooms:lupus:join' code %}" style="display: inline-block; padding: 0.5rem 1rem; background: #222; color: #fff; text-decoration: none; border-radius: 4px; font-size: 0.85rem;">
    Join as Player &rarr;
  </a>
  {% endif %}
</div>
{% endblock %}
