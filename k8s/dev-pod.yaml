apiVersion: v1
kind: Pod
metadata:
  name: marco-dev
  labels:
    app: marco-dev
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:16-bookworm
      env:
        - name: POSTGRES_DB
          value: marcosilva
        - name: POSTGRES_USER
          value: marcosilva
        - name: POSTGRES_PASSWORD
          value: devpassword
      ports:
        - containerPort: 5432
          hostPort: 5432
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
    - name: redis
      image: docker.io/valkey/valkey:8-alpine
      ports:
        - containerPort: 6379
    - name: django
      image: localhost/marco-silva.com:latest
      env:
        - name: POSTGRES_HOST
          value: localhost
        - name: POSTGRES_NAME
          value: marcosilva
        - name: POSTGRES_USER
          value: marcosilva
        - name: POSTGRES_PASSWORD
          value: devpassword
        - name: SECRET_KEY
          value: dev-insecure-secret-key
        - name: PLANZ_PASSWORD
          value: planz
        - name: GOOGLE_CALENDAR_ICAL_URL
          value: ""
        - name: ALLOWED_HOSTS
          value: "localhost,127.0.0.1"
        - name: DEBUG
          value: "true"
        - name: DJANGO_SETTINGS_MODULE
          value: website.settings
        - name: CELERY_BROKER_URL
          value: "redis://localhost:6379/0"
      ports:
        - containerPort: 8000
          hostPort: 8000
      volumeMounts:
        - name: media
          mountPath: /var/www/marco-silva.com/media
    - name: celery-worker
      image: localhost/marco-silva.com:latest
      command: ["celery", "-A", "website", "worker", "-l", "info", "--concurrency=2"]
      env:
        - name: POSTGRES_HOST
          value: localhost
        - name: POSTGRES_NAME
          value: marcosilva
        - name: POSTGRES_USER
          value: marcosilva
        - name: POSTGRES_PASSWORD
          value: devpassword
        - name: SECRET_KEY
          value: dev-insecure-secret-key
        - name: DJANGO_SETTINGS_MODULE
          value: website.settings
        - name: CELERY_BROKER_URL
          value: "redis://localhost:6379/0"
    - name: celery-beat
      image: localhost/marco-silva.com:latest
      command: ["celery", "-A", "website", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
      env:
        - name: POSTGRES_HOST
          value: localhost
        - name: POSTGRES_NAME
          value: marcosilva
        - name: POSTGRES_USER
          value: marcosilva
        - name: POSTGRES_PASSWORD
          value: devpassword
        - name: SECRET_KEY
          value: dev-insecure-secret-key
        - name: DJANGO_SETTINGS_MODULE
          value: website.settings
        - name: CELERY_BROKER_URL
          value: "redis://localhost:6379/0"
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: marco-pgdata
    - name: media
      persistentVolumeClaim:
        claimName: marco-media
