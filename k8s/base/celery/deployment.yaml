apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: marco-silva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: marco-silva.com:latest
          command: ["celery", "-A", "website", "worker", "-l", "info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secret
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: media
              mountPath: /var/www/marco-silva.com/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: marco-silva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: marco-silva.com:latest
          command: ["celery", "-A", "website", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secret
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
