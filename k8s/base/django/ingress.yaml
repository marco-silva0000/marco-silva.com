apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress
  namespace: marco-silva
spec:
  ingressClassName: traefik
  rules:
    - host: marco-silva.com
      http:
        paths:
          - backend:
              service:
                name: django
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: www.marco-silva.com
      http:
        paths:
          - backend:
              service:
                name: django
                port:
                  number: 80
            path: /
            pathType: Prefix
    - http:
        paths:
          - backend:
              service:
                name: django
                port:
                  number: 80
            path: /
            pathType: Prefix
